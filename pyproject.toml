[project]
name = "rtp-live-streaming"
version = "0.1.0"
description = "A Python-based real-time audio and video streaming system using custom RTP/RTCP implementation over UDP, with dynamic codec switching, jitter buffering, and network performance analysis."
readme = "README.md"
authors = [{ name = "Alireza", email = "thealipoor@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
]

[project.scripts]
rtp-live-streaming = "rtp_live_streaming:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "runflare"
url = "https://mirror-pypi.runflare.com/simple"
default = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
indent-width = 4

# Python files in your src layout
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
    "I",  # Import sorting
    "UP", # Python modernization
    "B",  # Bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["unit: Unit tests", "integration: Integration tests"]
