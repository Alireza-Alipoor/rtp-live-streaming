
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: pytest
        name: Run tests
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
